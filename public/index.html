<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Home / X</title>
<style>
:root{--bg:#fff;--hover:rgba(15,20,25,.03);--border:#eff3f4;--text:#0f1419;--muted:#536471;--blue:#1d9bf0;--green:#00ba7c;--pink:#f91880;--panel:#f7f9f9}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"TwitterChirp",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* 安卓端防溢出：所有弹性子项可收缩、长文本可换行 */
#app,.modal,.post,.post-body,.comment,.reply-box,.composer{min-width:0}
.post-content,.c-content,.post-head,.c-head,.detail-meta{word-break:break-word;overflow-wrap:anywhere}
.reply-box input{min-width:0;flex:1}
.modal,.modal-content{overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}input,textarea{font-family:inherit}
#app{display:flex;justify-content:center;min-height:100vh}
#sidebar{width:275px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:0 8px;flex-shrink:0}
#main{width:600px;border-left:1px solid var(--border);border-right:1px solid var(--border);flex-shrink:0;min-height:100vh}
#rightbar{width:350px;padding:0 16px;margin-left:16px}
@media(max-width:1090px){#rightbar{display:none}}
#bottom-nav{display:none}
#mobile-top{display:none}

/* ================= 手机版 ================= */
@media(max-width:688px){
  #app{display:block;overflow-x:hidden}
  #sidebar{display:none}
  #rightbar{display:none !important}
  #main{width:100% !important;border:none;padding-bottom:70px;max-width:100vw}
  #mobile-top{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);z-index:30;border-bottom:1px solid var(--border);min-height:53px}
  #mobile-top .avatar{cursor:pointer}
  #mobile-top .xmark{font-weight:800;font-size:26px}
  #mobile-top .sub-btn{border:1px solid #cfd9de;border-radius:9999px;padding:6px 16px;font-weight:700;font-size:14px}
  #bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);height:56px;z-index:80;padding-bottom:env(safe-area-inset-bottom)}
  #bottom-nav .bn-item{flex:1;display:flex;align-items:center;justify-content:center;position:relative;color:#0f1419}
  #bottom-nav .bn-dot{position:absolute;top:8px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:9999px;background:var(--blue);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 4px}
}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}

/* ---------- 侧边栏（桌面） ---------- */
.x-logo{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.x-logo:hover{background:var(--hover)}
.nav-item{display:flex;align-items:center;padding:4px;border-radius:9999px;margin-bottom:2px}
.nav-inner{display:flex;align-items:center;gap:18px;padding:12px;font-size:20px;border-radius:9999px}
.nav-item:hover{background:var(--hover)}
.nav-item.active .nav-inner{font-weight:700}
.badge{background:var(--blue);color:#fff;font-size:11px;border-radius:9999px;padding:1px 7px;margin-left:auto}
#tweet-btn{background:var(--blue);color:#fff;border-radius:9999px;padding:15px 0;font-size:17px;font-weight:700;margin:16px 8px;width:90%}
#me-box{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border-radius:9999px;margin-bottom:12px;width:100%;text-align:left}
#me-box:hover{background:var(--hover)}
.me-name{font-weight:700;font-size:15px}.me-username{color:var(--muted);font-size:14px}

/* ---------- 帖子 ---------- */
.post{padding:12px 16px 6px;border-bottom:1px solid var(--border);display:flex;gap:12px;transition:background .15s}
.post:hover{background:var(--hover)}
.rt-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700;padding:10px 16px 0 44px}
.rt-label svg{width:16px;height:16px}
.post-body{flex:1;min-width:0}
.post-head{display:flex;align-items:center;gap:4px;font-size:15px;flex-wrap:nowrap;overflow:hidden}
.post-head .name{font-weight:700;white-space:nowrap}.post-head .name:hover{text-decoration:underline}
.post-head .time,.post-head .uname{color:var(--muted);white-space:nowrap}
.post-head .head-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.follow-sm{background:var(--text);color:#fff;border-radius:9999px;padding:3px 14px;font-weight:700;font-size:13px}
.post-menu{display:none;position:absolute;right:0;top:30px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px var(--border),0 4px 16px rgba(0,0,0,.15);z-index:60;min-width:210px;overflow:hidden}
.post-menu.open{display:block}
/* X 式底部操作面板 */
.action-sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;opacity:0;transition:opacity .2s}
.action-sheet-wrap.show{opacity:1}
.action-sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.action-sheet-wrap.show .action-sheet{transform:translateY(0)}
.as-item{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:15px 20px;font-size:16px;font-weight:600}
.as-item:active{background:#f7f9f9}
.as-ico{width:22px;display:inline-flex;justify-content:center;font-size:18px;font-weight:400}
.as-cancel{margin:10px 16px 4px;width:calc(100% - 32px);padding:14px;border:1px solid var(--border);border-radius:9999px;font-size:16px;font-weight:700}
.follow-sm.followed{background:var(--border);color:var(--muted)}
.follow-sm:active{transform:scale(.96)}
.post-content{font-size:15px;line-height:1.4;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.post-actions{display:flex;margin-top:4px;justify-content:space-between;align-items:center}
.act{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;font-weight:700;padding:4px 8px;border-radius:9999px;transition:.12s;white-space:nowrap}
.act svg{width:18px;height:18px}
.act.c:hover{background:rgba(29,155,240,.1);color:var(--blue)}
.act.r:hover{background:rgba(0,186,124,.1);color:var(--green)}
.act.l:hover{background:rgba(249,24,128,.1);color:var(--pink)}
.act.b:hover,.act.s:hover{background:rgba(29,155,240,.1);color:var(--blue)}
.act.liked{color:var(--pink)}.act.reposted{color:var(--green)}.act.bookmarked{color:var(--blue)}
.act .num{min-width:14px;text-align:left}
.del-btn{color:var(--muted);font-size:13px;padding:4px 8px;border-radius:9999px}
.del-btn:hover{color:#f4212e;background:rgba(244,33,46,.1)}

/* 内联回复框 */
.inline-reply{display:flex;gap:10px;padding:10px 16px 12px 56px;border-bottom:1px solid var(--border);background:#f7f9f9}
.inline-reply input{flex:1;background:#fff;border:1px solid #cfd9de;border-radius:9999px;padding:9px 16px;font-size:14px;color:var(--text);outline:none}
.inline-reply input:focus{border-color:var(--blue)}

/* ---------- 顶部 ---------- */
.page-head{padding:8px 16px;font-weight:700;font-size:20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);z-index:10;display:flex;align-items:center;gap:16px;min-height:53px}
.back-btn{width:34px;height:34px;border-radius:50%;margin-left:-8px;display:flex;align-items:center;justify-content:center}
.back-btn:hover{background:var(--hover)}
.tabs{display:flex;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);z-index:10}
.tab{flex:1;padding:14px 0;color:var(--muted);font-weight:500;font-size:15px;position:relative;transition:.15s}
.tab:hover{background:var(--hover)}
.tab.active{color:var(--text);font-weight:700}
.tab.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:4px;border-radius:4px;background:var(--blue)}

/* ---------- 发帖框 ---------- */
.composer{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px}
.composer textarea{flex:1;background:transparent;border:none;color:var(--text);font-size:20px;resize:none;outline:none;min-height:52px}
.composer textarea::placeholder{color:#536471}
.composer-foot{display:flex;justify-content:space-between;align-items:center;width:100%;border-top:1px solid var(--border);padding-top:10px;margin-top:8px}
.everyone{color:var(--blue);font-size:13px;font-weight:700;border-radius:9999px;padding:4px 12px}
.post-btn{background:var(--blue);color:#fff;border-radius:9999px;padding:9px 18px;font-weight:700;font-size:15px;transition:.15s;white-space:nowrap;flex-shrink:0}
.post-btn:hover{background:#1a8cd8}
.post-btn:disabled{opacity:.5;cursor:not-allowed}
.char-count{color:var(--muted);font-size:13px}.char-count.over{color:#f4212e}

/* ---------- 弹窗 ---------- */
#overlay{position:fixed;inset:0;background:rgba(91,112,131,.4);display:none;z-index:60;align-items:flex-start;justify-content:center}
#overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:600px;max-width:94vw;max-height:90vh;overflow-y:auto;margin-top:8vh}
@media(max-width:688px){.modal{margin-top:0;max-width:100vw;min-height:100vh;border-radius:0}}
.modal-head{padding:6px 16px;position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);display:flex;align-items:center;z-index:5;min-height:53px}
.modal-title{font-size:17px;font-weight:700;margin-left:24px}
.modal-close{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--hover)}

/* ---------- 详情 ---------- */
.detail .post-content{font-size:23px;line-height:1.3;margin-top:12px}
.detail-meta{color:var(--muted);font-size:15px;padding:16px 0;border-bottom:1px solid var(--border)}
.detail-meta b{color:var(--text)}
.reply-box{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.reply-box input{flex:1;background:transparent;border:none;color:var(--text);font-size:18px;outline:none}
.comment{padding:12px 16px;border-bottom:1px solid var(--border)}
.comment.child{margin-left:44px;border-left:2px solid var(--border)}
.comment .c-head{display:flex;align-items:center;gap:4px;font-size:15px;flex-wrap:wrap}
.comment .c-head .name{font-weight:700}
.comment .c-head .time{color:var(--muted);font-size:13px}
.comment .c-content{font-size:15px;line-height:1.4;margin:2px 0 6px;white-space:pre-wrap;word-break:break-word}
.comment .c-reply-btn{color:var(--blue);font-size:13px;font-weight:700;padding:2px 8px;border-radius:9999px}
.comment .c-reply-btn:hover{background:rgba(29,155,240,.1)}
.comment .c-replyto{color:var(--muted);font-size:13px}
.comment .c-replyto b{color:var(--blue)}
.c-nested-input{display:flex;gap:8px;padding:8px 0 4px}
.c-nested-input input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:9999px;padding:8px 14px;font-size:14px;color:var(--text);outline:none}

/* ---------- 右栏 ---------- */
.search-box{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:9999px;padding:10px 16px;margin:8px 0;position:sticky;top:8px;z-index:11}
.search-box:focus-within{background:#fff;border:1px solid var(--blue);padding:9px 15px}
.search-box svg{color:#536471;flex-shrink:0}
.search-box input{background:transparent;border:none;color:var(--text);font-size:15px;outline:none;width:100%}
.card{background:var(--panel);border-radius:16px;padding:16px;margin-bottom:16px}
.card h2{font-size:20px;font-weight:800;margin-bottom:4px}
.card h3{font-size:17px;font-weight:800;margin-bottom:12px}
.card .sub{color:#536471;font-size:13px;font-weight:500;margin-bottom:12px}
.trend{padding:8px 0;cursor:pointer}
.trend:hover{background:rgba(15,20,25,.03)}
.trend .t1{font-size:13px;color:#536471}.trend .t2{font-weight:700;font-size:15px}.trend .t3{font-size:13px;color:#536471}
.user-row{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.premium-btn{background:var(--blue);color:#fff;border-radius:9999px;padding:8px 20px;font-weight:700;font-size:15px}
.foot-links{color:#536471;font-size:13px;line-height:2;padding:12px 16px}

/* ---------- 通知 ---------- */
.notif{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;font-size:15px;cursor:pointer}
.notif:hover{background:var(--hover)}
.notif.unread{background:rgba(29,155,240,.05)}
.notif-icon{color:var(--blue);flex-shrink:0;padding-top:2px}
.notif .content{color:var(--muted);margin-top:2px}

/* ---------- 个人主页 ---------- */
.banner{height:200px;background:linear-gradient(120deg,#1d9bf0 0%,#7856ff 100%)}
.profile-head{padding:0 16px 16px;border-bottom:1px solid var(--border)}
.profile-avatar{margin-top:-72px;border:4px solid #fff;width:134px;height:134px;font-size:48px}
.profile-name{font-size:20px;font-weight:800;margin-top:8px}
.profile-uname{color:var(--muted);font-size:15px}
.profile-bio{margin-top:12px;font-size:15px;white-space:pre-wrap}
.profile-stats{display:flex;gap:20px;margin-top:12px;font-size:14px;color:var(--muted)}
.profile-stats b{color:var(--text)}
.btn-row{float:right;margin-top:8px;display:flex;gap:8px}
.pill-btn.primary{background:var(--text);color:#fff}
.pill-btn.icon-only{font-size:17px;padding:8px 12px}
.profile-avatar{position:relative;z-index:2;border:4px solid #fff;margin-top:-46px}
.profile-banner{height:150px;background:linear-gradient(135deg,#1d9bf0 0%,#8ecdf8 50%,#f0f3f4 100%);position:relative}
.pill-btn{border:1px solid #cfd9de;border-radius:9999px;padding:8px 18px;font-weight:700;font-size:15px;color:var(--text)}
.pill-btn:hover{background:rgba(15,20,25,.05)}
.pill-btn.primary{background:#0f1419;color:#fff;border-color:#0f1419}

/* ---------- 登录/注册 ---------- */
.login-wrap{min-height:100vh;background:#fff;display:flex;flex-direction:column}
.login-body{max-width:600px;width:100%;margin:0 auto;padding:16px 20px 40px;flex:1}
.login-body .xmark-big{font-size:48px;font-weight:800;text-align:center;margin:12px 0 28px}
.login-body h1{font-size:28px;font-weight:800;margin-bottom:28px}
.f-label{font-size:13px;color:var(--muted);position:absolute;top:6px;left:12px;background:#fff;padding:0 4px}
.f-group{position:relative;margin-bottom:24px}
.f-group input{width:100%;border:1px solid #cfd9de;border-radius:6px;padding:26px 12px 10px;font-size:17px;color:var(--text);outline:none;background:#fff}
.f-group input:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.f-hint{font-size:13px;color:var(--muted);margin-top:6px}
.btn-continue{width:100%;background:var(--blue);color:#fff;border-radius:9999px;padding:14px;font-weight:700;font-size:16px;margin-top:8px}
.err{color:#f4212e;font-size:13px;min-height:18px;margin:8px 0}
.login-switch{text-align:center;color:var(--blue);font-size:14px;margin-top:16px;cursor:pointer}

/* ---------- 抽屉 ---------- */
#drawer{position:fixed;inset:0;background:rgba(91,112,131,.4);z-index:70;display:none}
#drawer.open{display:block}
#drawer-panel{position:absolute;left:0;top:0;bottom:0;width:300px;max-width:84vw;background:#fff;border-right:1px solid var(--border);padding:12px 16px;overflow-y:auto;animation:slidein .2s}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.d-name{font-size:17px;font-weight:800;margin-top:12px}
.d-uname{color:var(--muted);font-size:14px}
.d-stats{display:flex;gap:16px;font-size:14px;color:var(--muted);margin-top:8px}
.d-stats b{color:var(--text)}
.d-item{display:flex;align-items:center;gap:16px;font-size:17px;font-weight:700;padding:12px 8px;border-radius:9999px;width:100%;text-align:left}
.d-item:hover{background:var(--hover)}
.d-sep{height:1px;background:var(--border);margin:8px 0}

.empty{color:#536471;text-align:center;padding:56px 24px;font-size:14px}
.empty b{display:block;color:var(--text);font-size:20px;font-weight:800;margin-bottom:4px}
#mobile-new{display:none;position:fixed;bottom:72px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;z-index:25;box-shadow:0 2px 8px rgba(0,0,0,.2)}
@media(max-width:688px){#mobile-new{display:flex;align-items:center;justify-content:center}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 20px;border-radius:9999px;font-size:14px;z-index:99;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
svg{fill:currentColor}
.share-img{width:100%;border-radius:12px;border:1px solid var(--border)}
</style>
</head>
<body>

<div class="login-wrap" id="auth-view" style="display:none">
  <div class="login-body">
    <div class="xmark-big">𝕏</div>
    <h1 id="auth-title">创建你的帐户</h1>
    <div class="f-group"><span class="f-label">名称</span><input id="f-nickname"></div>
    <div class="f-group"><span class="f-label">用户名</span><input id="f-username" autocomplete="username"></div>
    <div class="f-group"><span class="f-label">密码</span><input id="f-password" type="password" autocomplete="current-password"><div class="f-hint">至少 6 个字符。</div></div>
    <div class="err" id="auth-err"></div>
    <button class="btn-continue" id="auth-submit">创建帐户</button>
    <div class="login-switch" id="auth-switch">已经有帐户了？<b>登录</b></div>
  </div>
</div>

<div id="app" style="display:none">
  <div id="mobile-top">
    <span class="avatar" id="mt-avatar" style="width:34px;height:34px;font-size:14px;background:#cfd9de" onclick="openDrawer()">👤</span>
    <span class="xmark">𝕏</span>
    <button class="sub-btn" onclick="toast('仅演示 🎉')">Subscribe</button>
  </div>

  <nav id="sidebar">
    <div class="x-logo">𝕏</div>
    <div class="nav-item active" data-page="home"><div class="nav-inner">
      <svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 1.696L.622 8.807l1.06 1.696L3 9.679V19.5C3 20.881 4.119 22 5.5 22h13c1.381 0 2.5-1.119 2.5-2.5V9.679l1.318.824 1.06-1.696L12 1.696zM12 16.5c-1.933 0-3.5-1.567-3.5-3.5s1.567-3.5 3.5-3.5 3.5 1.567 3.5 3.5-1.567 3.5-3.5 3.5z"/></svg>
      <span class="side-text">首页</span></div></div>
    <div class="nav-item" data-page="explore"><div class="nav-inner">
      <svg width="26" height="26" viewBox="0 0 24 24"><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.596-1.904 1.178-1.177 1.904-2.801 1.904-4.596 0-3.59-2.91-6.5-6.5-6.5zm-8.5 6.5c0-4.694 3.806-8.5 8.5-8.5s8.5 3.806 8.5 8.5c0 1.986-.682 3.815-1.824 5.262l4.781 4.781-1.414 1.414-4.781-4.781c-1.447 1.142-3.276 1.824-5.262 1.824-4.694 0-8.5-3.806-8.5-8.5z"/></svg>
      <span class="side-text">探索</span></div></div>
    <div class="nav-item" data-page="notifications"><div class="nav-inner">
      <svg width="26" height="26" viewBox="0 0 24 24"><path d="M19.993 9.042C19.48 5.017 16.054 2 11.996 2s-7.49 3.021-7.999 7.051L2.866 18H7.1c.463 2.282 2.481 4 4.9 4s4.437-1.718 4.9-4h4.236l-1.143-8.958zM12 20c-1.306 0-2.417-.835-2.829-2h5.658c-.412 1.165-1.523 2-2.829 2zm-6.866-4l.847-6.698C6.364 6.272 8.941 4 11.996 4s5.627 2.268 6.013 5.295L18.864 16H5.134z"/></svg>

    <div class="nav-item" data-page="bookmarks"><div class="nav-inner">

async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'请求失败');return d}

/* ---------- 认证 ---------- */
let regMode=true;
function renderAuthMode(){$('#auth-title').textContent=regMode?'创建你的帐户':'登录 X';$('#auth-submit').textContent=regMode?'创建帐户':'登录';$('#auth-switch').innerHTML=regMode?'已经有帐户了？<b>登录</b>':'还没有帐户？<b>注册</b>';$('#f-nickname').parentElement.style.display=regMode?'':'none';$('#auth-err').textContent=''}
$('#auth-switch').onclick=()=>{regMode=!regMode;renderAuthMode()};

async function boot(){
  S.me=await api('/api/me');
  if(!S.me){$('#auth-view').style.display='flex';$('#app').style.display='none';return}
  $('#auth-view').style.display='none';$('#app').style.display='';
  ['#me-avatar','#mt-avatar','#d-avatar'].forEach(s=>{const e=$(s);if(e){e.style.background=S.me.avatar_color;e.textContent=(S.me.nickname||S.me.username).charAt(0)}});
  $('#me-nickname').textContent=S.me.nickname||S.me.username;$('#me-username').textContent='@'+S.me.username;
  $('#d-name').textContent=S.me.nickname||S.me.username;$('#d-uname').textContent='@'+S.me.username;
  try{const u=await api(`/api/users/${S.me.username}`);$('#d-following').textContent=u.following;$('#d-followers').textContent=u.followers}catch{}
  setPage(S.page);pollNotif();pollDm();clearInterval(S._p);S._p=setInterval(()=>{pollNotif();pollDm();if(S.page==='messages'&&!document.querySelector('#overlay.open'))renderMessages()},8000);
}
function openDrawer(){$('#drawer').classList.add('open')}
function closeDrawer(){$('#drawer').classList.remove('open')}
function logout(){api('/api/logout',{method:'POST'}).then(()=>{clearInterval(S._p);S.following=new Set();boot()})}
async function pollNotif(){try{const{unread}=await api('/api/notifications');const b=$('#notif-badge'),d=$('#bn-dot');if(b){b.style.display=unread>0?'':'none';b.textContent=unread>99?'99+':unread}if(d){d.style.display=unread>0?'flex':'none';d.textContent=unread>9?'9+':unread}}catch{}}

/* ---------- 私信/收件箱 ---------- */
async function renderMessages(){
  $('#main').innerHTML=`
    <div class="page-head" style="display:flex;align-items:center;gap:10px">
      <span onclick="openDrawer()" style="cursor:pointer">${avatarHtml(S.me,32)}</span>
      <span style="font-weight:800;font-size:20px">聊天</span>
      <button style="margin-left:auto;border:1px solid var(--border);border-radius:9999px;padding:6px 14px;font-weight:700;font-size:14px">全部 ⌄</button>
    </div>
    <div style="padding:10px 16px"><div class="search-box" style="position:static;background:#eff3f4;border-radius:9999px;padding:10px 16px"><span style="color:var(--muted)">🔍</span><input id="dm-search" placeholder="搜索" style="border:none;background:transparent;flex:1;outline:none;font-size:15px"></div></div>
    <div id="dm-list"><div class="empty">加载中…</div></div>`;
  const list=await api('/api/dm/conversations').catch(()=>[]);
  renderDmList(list);
  const inp=$('#dm-search');
  inp.addEventListener('input',()=>renderDmList(list.filter(c=>(c.nickname||c.username).toLowerCase().includes(inp.value.toLowerCase())||c.username.toLowerCase().includes(inp.value.toLowerCase()))));
}
function renderDmList(list){
  const el=$('#dm-list');if(!el)return;
  if(!list.length){
    el.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;text-align:center">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#0f1419" stroke-width="1.6"><path d="M4 6.5C4 5.12 5.12 4 6.5 4h11C18.88 4 20 5.12 20 6.5v8c0 1.38-1.12 2.5-2.5 2.5H9l-5 3.5v-14z"/></svg>
      <div style="font-size:22px;font-weight:800;margin-top:18px">收件箱空</div>
      <div style="color:var(--muted);margin-top:6px">给人发消息</div>
      <button class="post-btn" style="margin-top:22px" onclick="openNewDm()">写消息</button></div>`;
    return;
  }
  el.innerHTML=list.map(c=>`<div onclick="openChat('${esc(c.username)}')" style="display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;${c.unread?'background:#fff':''}">
    ${avatarHtml(c,48)}
    <div style="flex:1;min-width:0">
      <div style="display:flex;gap:4px;align-items:center"><b>${esc(c.nickname||c.username)}</b><span style="color:var(--muted);font-size:14px">@${esc(c.username)}</span><span style="color:var(--muted);font-size:14px">· ${timeAgo(c.last_time)}</span></div>
      <div style="font-size:14px;color:${c.unread?'var(--text)':'var(--muted)'};${c.unread?'font-weight:600':''};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.last_sender!==S.me.id&&c.last_sender!=null?'':''}${esc(c.last_msg||'')}</div>
    </div>
    ${c.unread?`<span style="min-width:18px;height:18px;border-radius:9999px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;align-self:center">${c.unread}</span>`:''}
  </div>`).join('');
}
function openNewDm(){
  api('/api/suggested').then(users=>{
    const m=$('#modal-content');
    m.innerHTML=`<div class="modal-head"><button class="modal-close" onclick="closeModal()">${sv(IC.close)}</button><span class="modal-title">新建消息</span></div>
    <div style="padding:8px 16px"><input id="ndm-user" placeholder="搜索用户" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;outline:none"></div>
    <div id="ndm-list" style="padding-bottom:20px">${users.map(u=>`<div onclick="closeModal();openChat('${esc(u.username)}')" style="display:flex;gap:10px;padding:10px 16px;cursor:pointer">${avatarHtml(u,40)}<div><b>${esc(u.nickname||u.username)}</b> <span style="color:var(--muted)">@${esc(u.username)}</span></div></div>`).join('')}</div>`;
    $('#overlay').classList.add('open');

/* 发帖图片：浏览器端压缩（长边900px JPEG60%，省存储） */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const c=document.createElement('canvas');const max=900;
      let w=img.width,h=img.height;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',0.6))};
    img.onerror=reject;img.src=url;
  });
}

  let imgs=[];try{imgs=p.images?JSON.parse(p.images):[]}catch(e){}

  if(imgs.length===1)return `<div style="margin-top:10px">${cell(imgs[0],0)}</div>`;
  return `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">${imgs.map((src,i)=>cell(src,i)).join('')}</div>`;
}

/* 发帖图片选择（压缩到 ≤900px JPEG，最多4张，省服务器存储） */
function setupComposerImages(taId,btnWrapSel,modalRoot){
  const root=modalRoot||document;
  const wrap=root.querySelector(btnWrapSel);
  const ta=root.querySelector('#'+taId);
  wrap.insertAdjacentHTML('afterbegin',`<button type="button" title="添加图片" style="color:var(--blue);font-size:18px">🖼️</button><input type="file" accept="image/*" multiple style="display:none">`);
  const btn=wrap.querySelector('button[type="button"]'),file=wrap.querySelector('input[type=file]');
  root.__imgs=root.__imgs||[];
  btn.onclick=()=>file.click();
  file.onchange=async()=>{
    for(const f of file.files){
      if(root.__imgs.length>=4){toast('最多 4 张图片');break}
      try{root.__imgs.push(await compressImage(f))}catch(e){}
    }
    file.value='';
    const prev=root.querySelector('.compose-preview');
    if(prev)prev.innerHTML=root.__imgs.map((d,i)=>`<div style="position:relative"><img src="${d}" style="width:72px;height:72px;object-fit:cover;border-radius:10px"><span style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer" onclick="removeComposerImg(${i},'${taId}','${btnWrapSel}',${modalRoot?'true':'false'})">✕</span></div>`).join('');
  };
}
function removeComposerImg(i,taId,btnWrapSel,modal){
  const root=modal?$('#modal-content'):document;

  const prev=root.querySelector('.compose-preview');
  if(prev)prev.innerHTML=root.__imgs.map((d,j)=>`<div style="position:relative"><img src="${d}" style="width:72px;height:72px;object-fit:cover;border-radius:10px"><span style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer" onclick="removeComposerImg(${j},'${taId}','${btnWrapSel}',${modal?'true':'false'})">✕</span></div>`).join('');

function findPost(id){return S.posts.find(p=>p.id===id)}
function updatePostDom(id,patch){
  const p=findPost(id);if(p)Object.assign(p,patch);
  document.querySelectorAll(`.post[data-id="${id}"]`).forEach(el=>{
    if(patch.liked!==undefined){const a=el.querySelector('.act.l');a.classList.toggle('liked',patch.liked);a.innerHTML=sv(patch.liked?IC.likeFill:IC.like)+`<span class="num">${p?p.likes:''}</span>`}
    if(patch.reposted!==undefined){const a=el.querySelector('.act.r');a.classList.toggle('reposted',patch.reposted);a.querySelector('.num').textContent=p.reposts||''}
    if(patch.bookmarked!==undefined){const a=el.querySelector('.act.b');a.classList.toggle('bookmarked',patch.bookmarked);a.innerHTML=sv(patch.bookmarked?IC.bookmarkFill:IC.bookmark)}
    if(patch.comments!==undefined){el.querySelector('.act.c .num').textContent=patch.comments||''}
    if(patch.views!==undefined){const v=el.querySelector('[data-views]');if(v)v.textContent=fmtViews(patch.views)}

}

async function toggleRepost(id){const p=findPost(id);if(!p)return;const on=!p.reposted;updatePostDom(id,{reposted:on,reposts:p.reposts+(on?1:-1)});

function toggleInlineReply(id){

async function openShare(id){
  const p=findPost(id)||await api(`/api/posts/${id}/single`);
  const W=1080,H=620;const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1d9bf0');g.addColorStop(1,'#7856ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(W-120,100,220,0,7);ctx.fill();ctx.beginPath();ctx.arc(80,H-60,180,0,7);ctx.fill();
  ctx.fillStyle='#fff';roundRect(ctx,60,70,W-120,H-140,36);ctx.fill();
  // 头像
  ctx.fillStyle=p.avatar_color||'#1d9bf0';ctx.beginPath();ctx.arc(150,180,46,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.textAlign='center';ctx.fillText((p.nickname||p.username).charAt(0),150,196);
  ctx.textAlign='left';ctx.fillStyle='#0f1419';ctx.font='bold 40px sans-serif';ctx.fillText(p.nickname||p.username,220,170);
  ctx.fillStyle='#536471';ctx.font='30px sans-serif';ctx.fillText('@'+p.username,220,218);
  // 内容（自动换行）
  ctx.fillStyle='#0f1419';ctx.font='38px "PingFang SC","Microsoft YaHei",sans-serif';
  wrapText(ctx,p.content,110,300,W-220,54);
  ctx.fillStyle='#536471';ctx.font='26px sans-serif';ctx.fillText(new Date(p.created_at).toLocaleString('zh-CN'),110,H-140);
  ctx.fillStyle='#0f1419';ctx.font='bold 34px sans-serif';ctx.fillText('𝕏',W-160,H-140);
  ctx.fillStyle='#1d9bf0';ctx.font='26px sans-serif';ctx.fillText('来自 '+location.hostname+' · 扫码加入讨论',110,H-100);
  const url=c.toDataURL('image/png');
  const m=$('#modal-content');
  m.innerHTML=`<div class="modal-head"><button class="modal-close" onclick="closeModal()">${sv(IC.close)}</button><span class="modal-title">分享帖子</span></div>
    <div style="padding:16px"><img class="share-img" src="${url}">

  $('#overlay').classList.add('open');
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrapText(ctx,text,x,y,maxW,lh){const chars=[...text];let line='',lines=[];for(const ch of chars){if(ctx.measureText(line+ch).width>maxW){lines.push(line);line=ch}else line+=ch}lines.push(line);lines.slice(0,5).forEach((l,i)=>ctx.fillText(l,x,y+i*lh));if(lines.length>5)ctx.fillText('…',x,y+5*lh)}

async function followFromSuggest(username,btn){

      <div class="f-group"><span class="f-label">链接</span><input id="e-link" value="${esc(me.link||'')}" maxlength="100" placeholder="https://"></div>
    </div>`;
    const colors=['#1d9bf0','#f91880','#00ba7c','#ffd400','#7856ff','#ff7a00','#00b8d9'];let sel=me.avatar_color||colors[0];
    const cp=m.querySelector('#colors');
    colors.forEach(c=>{const b=document.createElement('button');b.style.cssText=`width:36px;height:36px;border-radius:50%;background:${c};border:${c===sel?'3px solid #0f1419':'3px solid transparent'}`;b.onclick=()=>{sel=c;[...cp.children].forEach(x=>x.style.border='3px solid transparent');b.style.border='3px solid #0f1419'};cp.appendChild(b)});
    m.querySelector('#e-save').onclick=async()=>{try{
      await api('/api/me',{method:'PUT',body:JSON.stringify({nickname:m.querySelector('#e-nickname').value.trim(),bio:m.querySelector('#e-bio').value,avatar_color:sel,location:m.querySelector('#e-location').value.trim(),link:m.querySelector('#e-link').value.trim()})});
      closeModal();toast('资料已更新');boot()}catch(e){toast(e.message)}};
    $('#overlay').classList.add('open');
  });
}

$('#search-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())setPage('search',e.target.value.trim())});
renderAuthMode();
boot();
</script>
</body>
</html>
