<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>yuacio 管理后台</title>
<style>
:root{--bg:#fff;--panel:#f7f9f9;--border:#eff3f4;--text:#0f1419;--muted:#536471;--blue:#1d9bf0;--hover:rgba(15,20,25,.04);--danger:#f4212e;--green:#00ba7c;--gold:#f5a623}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px}
a{color:var(--blue);text-decoration:none}
/* ---------- 布局 ---------- */
#shell{display:none;min-height:100vh}
#side{width:250px;border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;padding:12px 8px;display:flex;flex-direction:column;background:#fff;z-index:20}
#side .brand{font-size:22px;font-weight:800;padding:10px 12px 18px;display:flex;align-items:center;gap:8px}
#side .brand small{font-size:12px;font-weight:600;color:var(--muted);background:var(--panel);padding:2px 8px;border-radius:9999px}
.nav{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:9999px;font-size:17px;font-weight:600;margin-bottom:2px;position:relative}
.nav:hover{background:var(--hover)}
.nav.active{background:var(--panel);font-weight:800}
.nav .ic{width:22px;height:22px;flex-shrink:0}
.nav .pill{background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:9999px;padding:1px 7px;margin-left:auto}
#side .foot{margin-top:auto;border-top:1px solid var(--border);padding:12px 6px 0;font-size:13px;color:var(--muted)}
#side .foot b{color:var(--text)}
#main{flex:1;margin-left:250px;min-height:100vh;max-width:1100px}
.top{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);z-index:15;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px}
.top h1{font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.wrap{padding:20px}
/* ---------- 通用块 ---------- */
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
.card h3{font-size:16px;font-weight:800;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.stat{border:1px solid var(--border);border-radius:16px;padding:16px}
.stat .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.stat .d{font-size:12px;color:var(--muted);margin-top:4px}
.stat.hot{border-color:#ffd6d9;background:#fff8f8}
.stat.warn{border-color:#ffe6c2;background:#fffaf2}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.btn{border-radius:9999px;padding:8px 16px;font-weight:700;font-size:14px;border:1px solid transparent;white-space:nowrap}
.btn.pri{background:var(--text);color:#fff}
.btn.pri:hover{opacity:.88}
.btn.blue{background:var(--blue);color:#fff}
.btn.line{border-color:#cfd9de;color:var(--text)}
.btn.line:hover{background:var(--hover)}
.btn.danger{background:#fff;color:var(--danger);border-color:#ffd6d9}
.btn.danger:hover{background:#fff1f2}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input.search{flex:1;border:1px solid #cfd9de;border-radius:9999px;padding:9px 16px;outline:none;background:#fff}
input.search:focus{border-color:var(--blue)}
input.txt,select.txt{border:1px solid #cfd9de;border-radius:10px;padding:8px 12px;outline:none;width:100%}
input.txt:focus,select.txt:focus{border-color:var(--blue)}
/* ---------- 表格 ---------- */
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tb td{padding:12px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tb tr:last-child td{border-bottom:none}
.tb tr:hover td{background:var(--hover)}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0;background:var(--blue)}
.un{font-weight:700}
.uu{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:9999px;background:var(--panel);color:var(--muted)}
.tag.g{background:#e8f7ee;color:#08804f}
.tag.b{background:#e8f4fd;color:#0b74b6}
.tag.r{background:#fdecee;color:#c0182a}
.tag.y{background:#fdf5e3;color:#a4710a}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border-radius:9999px;padding:4px 12px;font-size:13px;font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-size:17px;font-weight:800;margin-bottom:4px}
/* ---------- 图表 ---------- */
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding:8px 4px 0}
.bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars .col{width:100%;max-width:44px;display:flex;gap:3px;align-items:flex-end;height:100%}
.bars .c1{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.bars .c2{flex:1;background:#b9e2ff;border-radius:4px 4px 0 0;min-height:2px}
.bars .lb{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
/* ---------- 登录 ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:380px}
#login .logo{font-size:34px;font-weight:800;text-align:center;margin-bottom:6px}
#login .ttl{font-size:24px;font-weight:800;text-align:center;margin-bottom:24px}
#login .lb2{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block}
#login input{width:100%;border:1px solid #cfd9de;border-radius:10px;padding:13px 14px;font-size:15px;outline:none;margin-bottom:14px;background:#fff}
#login input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(29,155,240,.15)}
#login .go{width:100%;background:var(--text);color:#fff;border-radius:9999px;padding:14px;font-weight:800;font-size:16px}
#login .hint{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.err{color:var(--danger);font-size:13px;margin-bottom:10px;display:none}
/* ---------- 模态 ---------- */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;align-items:center;justify-content:center;padding:20px}
#modal .m-box{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:80vh;overflow:auto;padding:20px}
#modal h4{font-size:18px;font-weight:800;margin-bottom:6px}
#modal p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:16px}
#modal textarea{width:100%;border:1px solid #cfd9de;border-radius:10px;padding:10px 12px;min-height:90px;outline:none;resize:vertical}
/* ---------- toast ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--blue);color:#fff;padding:10px 20px;border-radius:9999px;font-size:14px;font-weight:600;z-index:99;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--danger)}
/* ---------- 手机 ---------- */
@media(max-width:820px){
  #side{width:100%;position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;border-right:none;border-top:1px solid var(--border);padding:0;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto}
  #side .brand,#side .foot{display:none}
  #side .nav{flex:1;flex-direction:column;gap:3px;font-size:10px;font-weight:600;padding:8px 2px;border-radius:0;margin:0;justify-content:center;min-width:0}
  #side .nav .ic{width:20px;height:20px}
  #side .nav .pill{position:absolute;top:4px;right:16%;margin:0}
  #main{margin-left:0;padding-bottom:64px;max-width:100vw}
  .wrap{padding:12px}
  .tb .hideM{display:none}
  .top{padding:10px 12px}
  .top h1{font-size:17px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .stat .v{font-size:22px}
}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <img src="/logo.png" alt="yuacio" style="width:52px;height:52px;display:block;margin:0 auto 6px">
    <div class="ttl">yuacio 管理后台</div>
    <div class="err" id="l-err"></div>
    <label class="lb2">管理员账号</label>
    <input id="l-user" autocomplete="username" placeholder="admin">
    <label class="lb2">密码</label>
    <input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="go" id="l-go">登录</button>
    <div class="hint">仅限学校管理员使用<br>初始账号 admin / yuacio-school-2026</div>
  </div>
</div>

<div id="shell">
  <aside id="side">
    <div class="brand"><img src="/logo.png" style="width:24px;height:24px"> <small>管理后台</small></div>
    <a class="nav active" data-p="dash"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg><span>概览</span></a>
    <a class="nav" data-p="users"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 11a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg><span>用户</span></a>
    <a class="nav" data-p="posts"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18v3H3V4zm0 6h18v2H3v-2zm0 5h12v2H3v-2z"/></svg><span>内容</span></a>
    <a class="nav" data-p="reports"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v14H7l-4 4V3zm4 4v2h10V7H7zm0 4v2h7v-2H7z"/></svg><span>举报</span><span class="pill" id="nv-rep" style="display:none">0</span></a>
    <a class="nav" data-p="verify"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 2 3.1-.4 1.1 2.9 2.9 1.1-.4 3.1L23 13l-2 2.4.4 3.1-2.9 1.1-1.1 2.9-3.1-.4L12 24l-2.4-2-3.1.4-1.1-2.9-2.9-1.1.4-3.1L1 13l2-2.4-.4-3.1 2.9-1.1L6.6 3.5l3.1.4L12 2zm-1.2 13.4l5.1-5.1-1.4-1.4-3.7 3.7-1.8-1.8-1.4 1.4 3.2 3.2z"/></svg><span>认证</span><span class="pill" id="nv-ver" style="display:none">0</span></a>
    <a class="nav" data-p="trends"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17l6-6 4 4 8-8v4h-2V9.4l-6 6-4-4L3 19.6V17z"/></svg><span>趋势</span></a>
    <a class="nav" data-p="admins" id="nav-admins"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l9 4v6c0 5.5-3.8 10.7-9 12-5.2-1.3-9-6.5-9-12V5l9-4zm0 6a2.5 2.5 0 100 5 2.5 2.5 0 000-5zm0 6c-2 0-3.5 1.2-3.5 2.5V17h7v-1.5C15.5 14.2 14 13 12 13z"/></svg><span>管理员</span></a>
    <div class="foot">
      已登录 <b id="me-name">—</b><br>
      <span id="me-role"></span><br><br>
      <button class="btn line sm" id="logout" style="width:100%">退出登录</button>
    </div>
  </aside>
  <main id="main">
    <div class="top"><div><h1 id="pg-title">概览</h1><div class="sub" id="pg-sub"></div></div><div class="spacer"></div><button class="btn line sm" id="refresh">刷新</button></div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div id="modal"><div class="m-box" id="modal-body"></div></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { n = Number(n)||0; return n >= 1e4 ? (n/1e4).toFixed(1).replace(/\.0$/,'') + '万' : String(n); };
const dt = s => { if(!s) return ''; const d = new Date(s); const p = x => String(x).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const ago = s => { const t = (Date.now() - new Date(s))/1000; if(t<60) return '刚刚'; if(t<3600) return Math.floor(t/60)+'分钟前'; if(t<86400) return Math.floor(t/3600)+'小时前'; return Math.floor(t/86400)+'天前'; };

let A = null, STATS = null, PAGE = 'dash';

async function api(url, opt = {}) {
  const r = await fetch(url, { credentials:'same-origin', headers:{'Content-Type':'application/json'}, ...opt });
  let d = null; try { d = await r.json(); } catch(e){}
  if (r.status === 401) { showLogin(); throw new Error((d && d.error) || '请重新登录'); }
  if (!r.ok) throw new Error((d && d.error) || '请求失败');
  return d;
}
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.className = '', 2200);
}
function showLogin(){ $('#shell').style.display='none'; $('#login').style.display='flex'; }
function avatar(name){ const c = ['#1d9bf0','#f91880','#00ba7c','#7856ff','#ff7a00'][(name||'').length % 5]; return `<span class="av" style="background:${c}">${esc((name||'?').slice(0,1).toUpperCase())}</span>`; }
const roleTag = r => r === 'official' ? '<span class="tag y">金V 官媒</span>' : r === 'verified' ? '<span class="tag b">蓝V 认证</span>' : '<span class="tag">普通</span>';

/* ================= 登录 ================= */
$('#l-go').onclick = async () => {
  const u = $('#l-user').value.trim(), p = $('#l-pass').value;
  if (!u || !p) { $('#l-err').style.display='block'; $('#l-err').textContent='请填写账号和密码'; return; }
  try {
    A = await api('/api/admin/login', { method:'POST', body: JSON.stringify({ username:u, password:p }) });
    $('#l-err').style.display='none';
    boot();
  } catch(e) { $('#l-err').style.display='block'; $('#l-err').textContent = e.message; }
};
$('#l-pass').onkeydown = e => { if (e.key === 'Enter') $('#l-go').click(); };
$('#logout').onclick = async () => { await api('/api/admin/logout', { method:'POST' }); A = null; showLogin(); };

/* ================= 启动 ================= */
async function boot() {
  if (!A) { try { A = await api('/api/admin/me'); } catch(e) { return; } }
  $('#shell').style.display = 'block';
  $('#login').style.display = 'none';
  $('#me-name').textContent = A.name || A.username;
  $('#me-role').textContent = A.super ? '超级管理员' : '普通管理员';
  if (!A.super) $('#nav-admins').style.display = 'none';
  go(PAGE);
  loadBadges();
}
async function loadBadges() {
  try {
    const s = await api('/api/admin/stats');
    STATS = s;
    const set = (id, n) => { const e = $(id); if (!e) return; e.style.display = n > 0 ? 'inline-block' : 'none'; e.textContent = n; };
    set('#nv-rep', s.pendingReports); set('#nv-ver', s.pendingVerify);
    if (PAGE === 'dash') renderDash(s);
  } catch(e) {}
}
setInterval(() => { if (A) loadBadges(); }, 20000);

/* ================= 路由 ================= */
document.querySelectorAll('#side .nav').forEach(el => el.onclick = () => go(el.dataset.p));
$('#refresh').onclick = () => { go(PAGE); loadBadges(); };
const TITLES = { dash:['概览','平台实时数据'], users:['用户管理','封禁、认证、重置密码'], posts:['内容管理','帖子与评论审核'], reports:['举报处理','用户提交的举报'], verify:['认证审批','官方认证 / 个人认证'], trends:['趋势干预','置顶或屏蔽话题'], admins:['管理员账号','增删管理人员'] };
function go(p) {
  PAGE = p;
  document.querySelectorAll('#side .nav').forEach(el => el.classList.toggle('active', el.dataset.p === p));
  const t = TITLES[p] || ['概览',''];
  $('#pg-title').textContent = t[0]; $('#pg-sub').textContent = t[1];
  ({ dash:renderDashPage, users:renderUsers, posts:renderPosts, reports:renderReports, verify:renderVerify, trends:renderTrends, admins:renderAdmins })[p]();
}

/* ================= 概览 ================= */
async function renderDashPage() {
  $('#view').innerHTML = '<div class="empty">加载中…</div>';
  try { STATS = await api('/api/admin/stats'); renderDash(STATS); } catch(e) { $('#view').innerHTML = `<div class="empty"><b>加载失败</b>${esc(e.message)}</div>`; }
}
function renderDash(s) {
  if (!s) return;
  const max = Math.max(1, ...s.trend.map(x => Math.max(x.users, x.posts)));
  const bars = s.trend.map(x => `<div class="bar" title="${x.lb} 注册 ${x.users} / 发帖 ${x.posts}">
      <div class="col"><div class="c1" style="height:${Math.round(x.users/max*100)}%"></div><div class="c2" style="height:${Math.round(x.posts/max*100)}%"></div></div>
      <div class="lb">${x.lb}</div></div>`).join('');
  $('#view').innerHTML = `
    <div class="grid">
      <div class="stat"><div class="k">👥 注册用户</div><div class="v">${fmt(s.users)}</div><div class="d">今日新增 ${s.todayUsers}</div></div>
      <div class="stat"><div class="k">📝 帖子总数</div><div class="v">${fmt(s.posts)}</div><div class="d">今日新增 ${s.todayPosts}</div></div>
      <div class="stat"><div class="k">💬 评论总数</div><div class="v">${fmt(s.comments)}</div></div>
      <div class="stat"><div class="k">💌 私信消息</div><div class="v">${fmt(s.dms)}</div></div>
      <div class="stat"><div class="k">👨‍👩‍👧 群组</div><div class="v">${fmt(s.groups)}</div></div>
      <div class="stat warn"><div class="k">🛡 待办事项</div><div class="v">${s.pendingVerify + s.pendingReports}</div><div class="d">认证 ${s.pendingVerify} · 举报 ${s.pendingReports}</div></div>
      <div class="stat hot"><div class="k">🚫 已封禁</div><div class="v">${fmt(s.banned)}</div></div>
      <div class="stat hot"><div class="k">🗑 已下架帖子</div><div class="v">${fmt(s.removed)}</div></div>
    </div>
    <div class="card">
      <h3>近 7 天活跃</h3>
      <div class="bars">${bars}</div>
      <div class="legend"><span><i style="background:#1d9bf0"></i>新增用户</span><span><i style="background:#b9e2ff"></i>新增帖子</span></div>
    </div>
    <div class="card">
      <h3>热门帖子（按点赞）</h3>
      ${s.hot.length ? s.hot.map(p => `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--border)">
        <div style="flex:1;min-width:0"><div style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.content || '(无文字)')}</div>
        <div class="uu" style="margin-top:3px">@${esc(p.username)} · ${p.likes} 个喜欢</div></div></div>`).join('') : '<div class="empty">暂无数据</div>'}
    </div>
    <div class="card">
      <h3>📌 管理提示</h3>
      <div style="font-size:14px;color:var(--muted);line-height:1.9">
        · 后台地址 <b>https://yuacio.onrender.com/admin</b>，请勿外传<br>
        · 封禁用户后对方无法登录，历史内容保留（可用「内容」页下架）<br>
        · 认证审批通过后，用户会收到「认证已通过」通知并显示徽标<br>
        · 趋势页可手动置顶学校官方话题，或屏蔽不良话题
      </div>
    </div>`;
}

/* ================= 用户 ================= */
async function renderUsers() {
  $('#view').innerHTML = `
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
      <input class="search" id="u-q" placeholder="搜索用户名或昵称…">
      <button class="btn line sm" id="u-ban">只看已封禁</button>
    </div>
    <div class="card" style="padding:0;overflow:auto"><div id="u-list"><div class="empty">加载中…</div></div></div>`;
  let onlyBanned = false;
  const load = async () => {
    const q = $('#u-q').value.trim();
    const rows = await api('/api/admin/users?q=' + encodeURIComponent(q) + (onlyBanned ? '&banned=1' : ''));
    $('#u-list').innerHTML = rows.length ? `<table class="tb"><thead><tr>
      <th>用户</th><th>角色</th><th class="hideM">帖子</th><th class="hideM">追随/关注</th><th class="hideM">注册时间</th><th style="text-align:right">操作</th>
    </tr></thead><tbody>${rows.map(u => `<tr data-id="${u.id}" data-un="${esc(u.username)}" data-role="${u.role||'user'}" data-banned="${u.banned?'1':''}">
      <td><div class="row" style="gap:8px">${avatar(u.username)}<div style="min-width:0"><div class="un">${esc(u.nickname||u.username)} ${u.banned?'<span class="tag r">已封禁</span>':''}</div><div class="uu">@${esc(u.username)}</div></div></div></td>
      <td>${roleTag(u.role)}</td>
      <td class="hideM">${u.posts}</td>
      <td class="hideM">${u.followers} / ${u.following}</td>
      <td class="hideM uu">${dt(u.created_at)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn line sm" data-act="open">管理</button>
      </td></tr>`).join('')}</tbody></table>` : '<div class="empty"><b>没有找到用户</b>换个关键词试试</div>';
    $('#u-list').querySelectorAll('[data-act="open"]').forEach(b => b.onclick = () => {
      const tr = b.closest('tr'); openUser(tr.dataset.id, tr.dataset.un, tr.dataset.role, tr.dataset.banned === '1');
    });
  };
  $('#u-q').oninput = () => { clearTimeout(window._ut); window._ut = setTimeout(load, 300); };
  $('#u-ban').onclick = () => { onlyBanned = !onlyBanned; $('#u-ban').classList.toggle('pri', onlyBanned); load(); };
  load();
}
function openUser(id, un, role, banned) {
  const m = $('#modal'), b = $('#modal-body');
  b.innerHTML = `<h4>管理 @${esc(un)}</h4><p>选择要执行的操作</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="row"><span style="flex:1;font-size:14px">账号状态</span>
        <button class="btn ${banned?'line':'danger'} sm" id="a-ban">${banned?'解封账号':'封禁账号'}</button></div>
      <div class="row"><span style="flex:1;font-size:14px">认证角色</span>
        <select class="txt" id="a-role" style="width:150px">
          <option value="user" ${role==='user'?'selected':''}>普通用户</option>
          <option value="verified" ${role==='verified'?'selected':''}>蓝V 认证</option>
          <option value="official" ${role==='official'?'selected':''}>金V 官媒</option>
        </select></div>
      <div class="row"><span style="flex:1;font-size:14px">重置密码</span>
        <input class="txt" id="a-pwd" placeholder="新密码（≥6位）" style="width:170px"></div>
      <div class="row"><span style="flex:1;font-size:14px">修改昵称</span>
        <input class="txt" id="a-nick" placeholder="新昵称" style="width:170px"></div>
      ${A.super ? `<div class="row" style="margin-top:6px"><span style="flex:1;font-size:14px;color:var(--danger)">危险操作</span>
        <button class="btn danger sm" id="a-del">删除该用户</button></div>` : ''}
    </div>
    <div class="row" style="margin-top:18px"><div class="spacer"></div><button class="btn line" id="a-close">关闭</button>
      <button class="btn pri" id="a-save">保存修改</button></div>`;
  m.style.display = 'flex';
  $('#a-close').onclick = closeModal;
  $('#a-ban').onclick = async () => {
    try { await api('/api/admin/users/' + id, { method:'POST', body: JSON.stringify({ action:'ban', value: !banned }) }); toast(banned?'已解封':'已封禁'); closeModal(); renderUsers(); }
    catch(e) { toast(e.message, true); }
  };
  if ($('#a-del')) $('#a-del').onclick = async () => {
    if (!confirm(`确认永久删除 @${un} 及其全部内容？此操作不可恢复。`)) return;
    try { await api('/api/admin/users/' + id, { method:'POST', body: JSON.stringify({ action:'delete' }) }); toast('已删除'); closeModal(); renderUsers(); }
    catch(e) { toast(e.message, true); }
  };
  $('#a-save').onclick = async () => {
    const rv = $('#a-role').value, pwd = $('#a-pwd').value, nick = $('#a-nick').value.trim();
    try {
      if (rv !== role) await api('/api/admin/users/' + id, { method:'POST', body: JSON.stringify({ action:'role', value: rv }) });
      if (pwd) await api('/api/admin/users/' + id, { method:'POST', body: JSON.stringify({ action:'password', value: pwd }) });
      if (nick) await api('/api/admin/users/' + id, { method:'POST', body: JSON.stringify({ action:'nickname', value: nick }) });
      toast('已保存'); closeModal(); renderUsers(); loadBadges();
    } catch(e) { toast(e.message, true); }
  };
}

/* ================= 内容 ================= */
async function renderPosts() {
  $('#view').innerHTML = `
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
      <input class="search" id="p-q" placeholder="搜索帖子内容或作者…">
      <button class="btn line sm" id="p-rm">只看已下架</button>
      <button class="btn line sm" id="p-cm">评论管理</button>
    </div>
    <div class="card" style="padding:0;overflow:auto"><div id="p-list"><div class="empty">加载中…</div></div></div>`;
  let onlyRemoved = false;
  const load = async () => {
    const q = $('#p-q').value.trim();
    const rows = await api('/api/admin/posts?q=' + encodeURIComponent(q) + (onlyRemoved ? '&removed=1' : ''));
    $('#p-list').innerHTML = rows.length ? `<table class="tb"><thead><tr>
      <th>作者</th><th>内容</th><th class="hideM">互动</th><th class="hideM">时间</th><th style="text-align:right">操作</th></tr></thead>
      <tbody>${rows.map(p => `<tr>
        <td><div class="row" style="gap:8px">${avatar(p.username)}<div><div class="un">${esc(p.nickname||p.username)}</div><div class="uu">@${esc(p.username)}</div></div></div></td>
        <td style="max-width:340px"><div style="font-size:14px;${p.removed?'opacity:.5;text-decoration:line-through':''}">${esc((p.content||'').slice(0,90))}${p.images?' <span class="tag">🖼 图</span>':''}</div>
          ${p.removed?'<span class="tag r">已下架</span>':''}</td>
        <td class="hideM uu">❤️ ${p.likes} · 💬 ${p.comments} · 🔁 ${p.reposts}</td>
        <td class="hideM uu">${ago(p.created_at)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn ${p.removed?'line':'danger'} sm" data-a="toggle" data-id="${p.id}" data-rm="${p.removed?'1':''}">${p.removed?'恢复':'下架'}</button>
          <button class="btn line sm" data-a="del" data-id="${p.id}">删除</button></td></tr>`).join('')}</tbody></table>`
      : '<div class="empty"><b>没有帖子</b></div>';
    $('#p-list').querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      const id = b.dataset.id;
      if (b.dataset.a === 'toggle') {
        try { await api('/api/admin/posts/'+id, { method:'POST', body: JSON.stringify({ action: b.dataset.rm ? 'restore':'remove' }) }); toast('已处理'); load(); loadBadges(); }
        catch(e) { toast(e.message, true); }
      } else {
        if (!confirm('确认永久删除这条帖子？')) return;
        try { await api('/api/admin/posts/'+id, { method:'POST', body: JSON.stringify({ action:'delete' }) }); toast('已删除'); load(); }
        catch(e) { toast(e.message, true); }
      }
    });
  };
  $('#p-q').oninput = () => { clearTimeout(window._pt); window._pt = setTimeout(load, 300); };
  $('#p-rm').onclick = () => { onlyRemoved = !onlyRemoved; $('#p-rm').classList.toggle('pri', onlyRemoved); load(); };
  $('#p-cm').onclick = () => renderComments();
  load();
}
async function renderComments() {
  $('#view').innerHTML = `
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
      <input class="search" id="c-q" placeholder="搜索评论内容或作者…">
      <button class="btn line sm" id="c-back">返回帖子</button>
    </div>
    <div class="card" style="padding:0;overflow:auto"><div id="c-list"><div class="empty">加载中…</div></div></div>`;
  $('#c-back').onclick = renderPosts;
  const load = async () => {
    const q = $('#c-q').value.trim();
    const rows = await api('/api/admin/comments?q=' + encodeURIComponent(q));
    $('#c-list').innerHTML = rows.length ? `<table class="tb"><thead><tr><th>作者</th><th>评论</th><th class="hideM">时间</th><th style="text-align:right">操作</th></tr></thead>
      <tbody>${rows.map(c => `<tr><td><div class="row" style="gap:8px">${avatar(c.username)}<div><div class="un">${esc(c.nickname||c.username)}</div><div class="uu">@${esc(c.username)}</div></div></div></td>
      <td style="max-width:380px"><div style="font-size:14px;${c.removed?'opacity:.5;text-decoration:line-through':''}">${esc((c.content||'').slice(0,90))}</div>${c.removed?'<span class="tag r">已下架</span>':''}</td>
      <td class="hideM uu">${ago(c.created_at)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn ${c.removed?'line':'danger'} sm" data-a="t" data-id="${c.id}" data-rm="${c.removed?'1':''}">${c.removed?'恢复':'下架'}</button>
        <button class="btn line sm" data-a="d" data-id="${c.id}">删除</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty"><b>没有评论</b></div>';
    $('#c-list').querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      try {
        if (b.dataset.a === 't') await api('/api/admin/comments/'+b.dataset.id, { method:'POST', body: JSON.stringify({ action: b.dataset.rm?'restore':'remove' }) });
        else { if (!confirm('确认删除该评论？')) return; await api('/api/admin/comments/'+b.dataset.id, { method:'POST', body: JSON.stringify({ action:'delete' }) }); }
        toast('已处理'); load();
      } catch(e) { toast(e.message, true); }
    });
  };
  $('#c-q').oninput = () => { clearTimeout(window._ct); window._ct = setTimeout(load, 300); };
  load();
}

/* ================= 举报 ================= */
async function renderReports() {
  $('#view').innerHTML = '<div class="card" style="padding:0;overflow:auto"><div id="r-list"><div class="empty">加载中…</div></div></div>';
  try {
    const rows = await api('/api/admin/reports');
    $('#r-list').innerHTML = rows.length ? `<table class="tb"><thead><tr><th>类型</th><th>内容</th><th class="hideM">举报人</th><th class="hideM">时间</th><th style="text-align:right">操作</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><span class="tag ${r.target_type==='user'?'y':'b'}">${r.target_type==='post'?'帖子':r.target_type==='comment'?'评论':'用户'}</span></td>
        <td style="max-width:360px"><div style="font-size:14px">${esc((r.snippet||'（内容已删除）').slice(0,80))}</div>
          <div class="uu">作者 @${esc(r.author||'-')} · 理由：${esc(r.reason||'未填写')}</div></td>
        <td class="hideM uu">@${esc(r.reporter||'-')}</td><td class="hideM uu">${ago(r.created_at)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn danger sm" data-id="${r.id}" data-t="${r.target_type}" data-tid="${r.target_id}" data-a="ban">下架内容</button>
          <button class="btn line sm" data-id="${r.id}" data-a="ignore">忽略</button></td></tr>`).join('')}</tbody></table>`
      : '<div class="empty"><b>没有待处理举报</b>干净得很</div>';
    $('#r-list').querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      try {
        if (b.dataset.a === 'ban') {
          const ep = b.dataset.t === 'post' ? '/api/admin/posts/' : b.dataset.t === 'comment' ? '/api/admin/comments/' : '/api/admin/users/';
          const action = b.dataset.t === 'user' ? 'ban' : 'remove';
          await api(ep + b.dataset.tid, { method:'POST', body: JSON.stringify(b.dataset.t === 'user' ? { action:'ban', value:true } : { action }) });
        }
        await api('/api/admin/reports/' + b.dataset.id, { method:'POST', body: JSON.stringify({ action: b.dataset.a === 'ignore' ? 'ignore' : 'handle' }) });
        toast('已处理'); renderReports(); loadBadges();
      } catch(e) { toast(e.message, true); }
    });
  } catch(e) { $('#r-list').innerHTML = `<div class="empty"><b>加载失败</b>${esc(e.message)}</div>`; }
}

/* ================= 认证 ================= */
async function renderVerify() {
  $('#view').innerHTML = '<div class="card" style="padding:0;overflow:auto"><div id="v-list"><div class="empty">加载中…</div></div></div>';
  try {
    const rows = await api('/api/admin/verify');
    $('#v-list').innerHTML = rows.length ? `<table class="tb"><thead><tr><th>申请人</th><th>申请类型</th><th>说明</th><th class="hideM">数据</th><th style="text-align:right">操作</th></tr></thead>
      <tbody>${rows.map(v => `<tr>
        <td><div class="row" style="gap:8px">${avatar(v.username)}<div><div class="un">${esc(v.nickname||v.username)}</div><div class="uu">@${esc(v.username)}</div></div></div></td>
        <td><span class="tag ${v.req_type==='official'?'y':'b'}">${v.req_type==='official'?'官方认证':'个人认证'}</span></td>
        <td style="max-width:300px;font-size:14px">${esc((v.info||'').slice(0,120))}</td>
        <td class="hideM uu">${v.posts} 帖 · ${v.followers} 粉丝</td>
        <td style="text-align:right;white-space:nowrap">${v.status==='pending'
          ? `<button class="btn blue sm" data-id="${v.id}" data-a="approve">通过</button>
             <button class="btn line sm" data-id="${v.id}" data-a="reject">驳回</button>`
          : `<span class="tag ${v.status==='approved'?'g':'r'}">${v.status==='approved'?'已通过':'已驳回'}</span>`}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty"><b>暂无认证申请</b></div>';
    $('#v-list').querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      try { await api('/api/admin/verify/' + b.dataset.id, { method:'POST', body: JSON.stringify({ action: b.dataset.a }) }); toast(b.dataset.a==='approve'?'已通过认证':'已驳回'); renderVerify(); loadBadges(); }
      catch(e) { toast(e.message, true); }
    });
  } catch(e) { $('#v-list').innerHTML = `<div class="empty"><b>加载失败</b>${esc(e.message)}</div>`; }
}

/* ================= 趋势 ================= */
async function renderTrends() {
  $('#view').innerHTML = `
    <div class="card">
      <h3>手动干预话题</h3>
      <div class="row" style="flex-wrap:wrap">
        <input class="txt" id="t-tag" placeholder="话题名，如 校园运动会" style="flex:1;min-width:180px">
        <button class="btn line" id="t-pin">置顶</button>
        <button class="btn danger" id="t-ban">屏蔽</button>
        <button class="btn line" id="t-clr">取消干预</button>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:10px">置顶：排到趋势第一；屏蔽：从趋势列表移除。不带 # 号。</div>
    </div>
    <div class="card" style="padding:0;overflow:auto"><div id="t-list"><div class="empty">加载中…</div></div></div>`;
  const act = async mode => {
    const tag = $('#t-tag').value.trim(); if (!tag) return toast('请填写话题', true);
    try { await api('/api/admin/trends', { method:'POST', body: JSON.stringify({ tag, mode }) }); toast('已生效'); load(); }
    catch(e) { toast(e.message, true); }
  };
  $('#t-pin').onclick = () => act('pinned');
  $('#t-ban').onclick = () => act('banned');
  $('#t-clr').onclick = () => act('clear');
  const load = async () => {
    try {
      const d = await api('/api/admin/trends');
      $('#t-list').innerHTML = d.list.length ? `<table class="tb"><thead><tr><th>#</th><th>话题</th><th class="hideM">来源</th><th class="hideM">发帖数</th><th style="text-align:right">状态</th></tr></thead>
        <tbody>${d.list.map((t, i) => `<tr><td style="color:var(--muted)">${i+1}</td>
          <td><b>#${esc(t.tag)}</b><div class="uu">${esc(t.author||'')}</div></td>
          <td class="hideM">${t.official?'<span class="tag y">官媒</span>':'<span class="tag b">认证</span>'}</td>
          <td class="hideM uu">${t.posts}</td>
          <td style="text-align:right">${t.mode==='pinned'?'<span class="tag g">已置顶</span>':t.mode==='banned'?'<span class="tag r">已屏蔽</span>':'<span class="tag">自然</span>'}</td></tr>`).join('')}</tbody></table>`
        : '<div class="empty"><b>暂无趋势话题</b>需要认证用户带 #话题 发帖</div>';
    } catch(e) { $('#t-list').innerHTML = `<div class="empty"><b>加载失败</b>${esc(e.message)}</div>`; }
  };
  load();
}

      <tbody>${rows.map(a => `<tr><td class="un">${esc(a.username)}</td><td>${esc(a.name||'')} ${a.super?'<span class="tag y">超管</span>':''}</td>
        <td class="hideM uu">${dt(a.created_at)}</td>

function closeModal(){ $('#modal').style.display = 'none'; }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
