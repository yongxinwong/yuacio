<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>yuacio 管理后台</title>
<style>
:root{--bg:#fff;--panel:#f7f9f9;--border:#eff3f4;--text:#0f1419;--muted:#536471;--blue:#1d9bf0;--hover:rgba(15,20,25,.04);--danger:#f4212e;--green:#00ba7c;--gold:#f5a623}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px}
a{color:var(--blue);text-decoration:none}
/* ---------- 布局 ---------- */
#shell{display:none;min-height:100vh}
#side{width:250px;border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;padding:12px 8px;display:flex;flex-direction:column;background:#fff;z-index:20}
#side .brand{font-size:22px;font-weight:800;padding:10px 12px 18px;display:flex;align-items:center;gap:8px}
#side .brand small{font-size:12px;font-weight:600;color:var(--muted);background:var(--panel);padding:2px 8px;border-radius:9999px}
.nav{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:9999px;font-size:17px;font-weight:600;margin-bottom:2px;position:relative}
.nav:hover{background:var(--hover)}
.nav.active{background:var(--panel);font-weight:800}
.nav .ic{width:22px;height:22px;flex-shrink:0}
.nav .pill{background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:9999px;padding:1px 7px;margin-left:auto}
#side .foot{margin-top:auto;border-top:1px solid var(--border);padding:12px 6px 0;font-size:13px;color:var(--muted)}
#side .foot b{color:var(--text)}
#main{flex:1;margin-left:250px;min-height:100vh;max-width:1100px}
.top{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);z-index:15;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px}
.top h1{font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.wrap{padding:20px}
/* ---------- 通用块 ---------- */
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
.card h3{font-size:16px;font-weight:800;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.stat{border:1px solid var(--border);border-radius:16px;padding:16px}
.stat .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.stat .d{font-size:12px;color:var(--muted);margin-top:4px}
.stat.hot{border-color:#ffd6d9;background:#fff8f8}
.stat.warn{border-color:#ffe6c2;background:#fffaf2}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.btn{border-radius:9999px;padding:8px 16px;font-weight:700;font-size:14px;border:1px solid transparent;white-space:nowrap}
.btn.pri{background:var(--text);color:#fff}
.btn.pri:hover{opacity:.88}
.btn.blue{background:var(--blue);color:#fff}
.btn.line{border-color:#cfd9de;color:var(--text)}
.btn.line:hover{background:var(--hover)}
.btn.danger{background:#fff;color:var(--danger);border-color:#ffd6d9}
.btn.danger:hover{background:#fff1f2}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input.search{flex:1;border:1px solid #cfd9de;border-radius:9999px;padding:9px 16px;outline:none;background:#fff}
input.search:focus{border-color:var(--blue)}
input.txt,select.txt{border:1px solid #cfd9de;border-radius:10px;padding:8px 12px;outline:none;width:100%}
input.txt:focus,select.txt:focus{border-color:var(--blue)}
/* ---------- 表格 ---------- */
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tb td{padding:12px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tb tr:last-child td{border-bottom:none}
.tb tr:hover td{background:var(--hover)}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0;background:var(--blue)}
.un{font-weight:700}
.uu{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:9999px;background:var(--panel);color:var(--muted)}
.tag.g{background:#e8f7ee;color:#08804f}
.tag.b{background:#e8f4fd;color:#0b74b6}
.tag.r{background:#fdecee;color:#c0182a}
.tag.y{background:#fdf5e3;color:#a4710a}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border-radius:9999px;padding:4px 12px;font-size:13px;font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-size:17px;font-weight:800;margin-bottom:4px}
/* ---------- 图表 ---------- */
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding:8px 4px 0}
.bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars .col{width:100%;max-width:44px;display:flex;gap:3px;align-items:flex-end;height:100%}
.bars .c1{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.bars .c2{flex:1;background:#b9e2ff;border-radius:4px 4px 0 0;min-height:2px}
.bars .lb{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
/* ---------- 登录 ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:380px}
#login .logo{font-size:34px;font-weight:800;text-align:center;margin-bottom:6px}
#login .ttl{font-size:24px;font-weight:800;text-align:center;margin-bottom:24px}
#login .lb2{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block}
#login input{width:100%;border:1px solid #cfd9de;border-radius:10px;padding:13px 14px;font-size:15px;outline:none;margin-bottom:14px;background:#fff}
#login input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(29,155,240,.15)}
#login .go{width:100%;background:var(--text);color:#fff;border-radius:9999px;padding:14px;font-weight:800;font-size:16px}
#login .hint{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.err{color:var(--danger);font-size:13px;margin-bottom:10px;display:none}
/* ---------- 模态 ---------- */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;align-items:center;justify-content:center;padding:20px}
#modal .m-box{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:80vh;overflow:auto;padding:20px}
#modal h4{font-size:18px;font-weight:800;margin-bottom:6px}
#modal p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:16px}
#modal textarea{width:100%;border:1px solid #cfd9de;border-radius:10px;padding:10px 12px;min-height:90px;outline:none;resize:vertical}
/* ---------- toast ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--blue);color:#fff;padding:10px 20px;border-radius:9999px;font-size:14px;font-weight:600;z-index:99;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--danger)}
/* ---------- 手机 ---------- */
@media(max-width:820px){
  #side{width:100%;position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;border-right:none;border-top:1px solid var(--border);padding:0;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto}
  #side .brand,#side .foot{display:none}
  #side .nav{flex:1;flex-direction:column;gap:3px;font-size:10px;font-weight:600;padding:8px 2px;border-radius:0;margin:0;justify-content:center;min-width:0}
  #side .nav .ic{width:20px;height:20px}
  #side .nav .pill{position:absolute;top:4px;right:16%;margin:0}
  #main{margin-left:0;padding-bottom:64px;max-width:100vw}
  .wrap{padding:12px}
  .tb .hideM{display:none}
  .top{padding:10px 12px}
  .top h1{font-size:17px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .stat .v{font-size:22px}
}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <img src="/logo.png" alt="yuacio" style="width:52px;height:52px;display:block;margin:0 auto 6px">
    <div class="ttl">yuacio 管理后台</div>
    <div class="err" id="l-err"></div>
    <label class="lb2">管理员账号</label>
    <input id="l-user" autocomplete="username" placeholder="admin">
    <label class="lb2">密码</label>
    <input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="go" id="l-go">登录</button>
    <div class="hint">仅限学校管理员使用<br>初始账号 admin / yuacio-school-2026</div>
  </div>
</div>

<div id="shell">
  <aside id="side">
    <div class="brand"><img src="/logo.png" style="width:24px;height:24px"> <small>管理后台</small></div>
    <a class="nav active" data-p="dash"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg><span>概览</span></a>
    <a class="nav" data-p="users"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 11a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg><span>用户</span></a>
    <a class="nav" data-p="posts"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18v3H3V4zm0 6h18v2H3v-2zm0 5h12v2H3v-2z"/></svg><span>内容</span></a>
    <a class="nav" data-p="reports"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v14H7l-4 4V3zm4 4v2h10V7H7zm0 4v2h7v-2H7z"/></svg><span>举报</span><span class="pill" id="nv-rep" style="display:none">0</span></a>
    <a class="nav" data-p="verify"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 2 3.1-.4 1.1 2.9 2.9 1.1-.4 3.1L23 13l-2 2.4.4 3.1-2.9 1.1-1.1 2.9-3.1-.4L12 24l-2.4-2-3.1.4-1.1-2.9-2.9-1.1.4-3.1L1 13l2-2.4-.4-3.1 2.9-1.1L6.6 3.5l3.1.4L12 2zm-1.2 13.4l5.1-5.1-1.4-1.4-3.7 3.7-1.8-1.8-1.4 1.4 3.2 3.2z"/></svg><span>认证</span><span class="pill" id="nv-ver" style="display:none">0</span></a>
    <a class="nav" data-p="trends"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17l6-6 4 4 8-8v4h-2V9.4l-6 6-4-4L3 19.6V17z"/></svg><span>趋势</span></a>
    <a class="nav" data-p="editor"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M17.7 2.3l4 4-1.4 1.4-4-4 1.4-1.4zM2 17.6V22h4.4L18.9 9.5l-4.4-4.4L2 17.6zM5.5 20H4v-1.5L14.5 8l1.5 1.5L5.5 20z"/></svg><span>界面编辑</span></a>
    <a class="nav" data-p="mods"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg><span>页面模块</span></a>
    <a class="nav" data-p="ads"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h14l4 6-4 6H3V6zm2 2v8h11.3l2.7-4-2.7-4H5zm2 1h6v2H7V9zm0 4h4v2H7v-2z"/></svg><span>广告</span></a>
    <a class="nav" data-p="admins" id="nav-admins"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l9 4v6c0 5.5-3.8 10.7-9 12-5.2-1.3-9-6.5-9-12V5l9-4zm0 6a2.5 2.5 0 100 5 2.5 2.5 0 000-5zm0 6c-2 0-3.5 1.2-3.5 2.5V17h7v-1.5C15.5 14.2 14 13 12 13z"/></svg><span>管理员</span></a>
    <div class="foot">
      已登录 <b id="me-name">—</b><br>
      <span id="me-role"></span><br><br>
      <button class="btn line sm" id="logout" style="width:100%">退出登录</button>
    </div>
  </aside>
  <main id="main">
    <div class="top"><div><h1 id="pg-title">概览</h1><div class="sub" id="pg-sub"></div></div><div class="spacer"></div><button class="btn line sm" id="refresh">刷新</button></div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div id="modal"><div class="m-box" id="modal-body"></div></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { n = Number(n)||0; return n >= 1e4 ? (n/1e4).toFixed(1).replace(/\.0$/,'') + '万' : String(n); };
const dt = s => { if(!s) return ''; const d = new Date(s); const p = x => String(x).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const ago = s => { const t = (Date.now() - new Date(s))/1000; if(t<60) return '刚刚'; if(t<3600) return Math.floor(t/60)+'分钟前'; if(t<86400) return Math.floor(t/3600)+'小时前'; return Math.floor(t/86400)+'天前'; };

let A = null, STATS = null, PAGE = 'dash';

async function up_url(v){return /^https?:\/\//.test(v)?'图片已上传到图床':'图片已就绪（本地存储，未配置图床）'}
async function api(url, opt = {}) {
  const r = await fetch(url, { credentials:'same-origin', headers:{'Content-Type':'application/json'}, ...opt });
  let d = null; try { d = await r.json(); } catch(e){}
  if (r.status === 401) { showLogin(); throw new Error((d && d.error) || '请重新登录'); }
  if (!r.ok) throw new Error((d && d.error) || '请求失败');
  return d;
}
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.className = '', 2200);
}
function showLogin(){ $('#shell').style.display='none'; $('#login').style.display='flex'; }
function avatar(name){ const c = ['#1d9bf0','#f91880','#00ba7c','#7856ff','#ff7a00'][(name||'').length % 5]; return `<span class="av" style="background:${c}">${esc((name||'?').slice(0,1).toUpperCase())}</span>`; }
const roleTag = r => r === 'official' ? '<span class="tag y">金V 官媒</span>' : r === 'verified' ? '<span class="tag b">蓝V 认证</span>' : '<span class="tag">普通</span>';

/* ================= 登录 ================= */
$('#l-go').onclick = async () => {
  const u = $('#l-user').value.trim(), p = $('#l-pass').value;
  if (!u || !p) { $('#l-err').style.display='block'; $('#l-err').textContent='请填写账号和密码'; return; }
  try {
    A = await api('/api/admin/login', { method:'POST', body: JSON.stringify({ username:u, password:p }) });
    $('#l-err').style.display='none';
    boot();
  } catch(e) { $('#l-err').style.display='block'; $('#l-err').textContent = e.message; }
};
$('#l-pass').onkeydown = e => { if (e.key === 'Enter') $('#l-go').click(); };
$('#logout').onclick = async () => { await api('/api/admin/logout', { method:'POST' }); A = null; showLogin(); };

/* ================= 启动 ================= */
async function boot() {
  if (!A) { try { A = await api('/api/admin/me'); } catch(e) { return; } }
  $('#shell').style.display = 'block';
  $('#login').style.display = 'none';
  $('#me-name').textContent = A.name || A.username;
  $('#me-role').textContent = A.super ? '超级管理员' : '普通管理员';
  if (!A.super) $('#nav-admins').style.display = 'none';
  go(PAGE);
  loadBadges();
}
async function loadBadges() {
  try {
    const s = await api('/api/admin/stats');
    STATS = s;
    const set = (id, n) => { const e = $(id); if (!e) return; e.style.display = n > 0 ? 'inline-block' : 'none'; e.textContent = n; };
    set('#nv-rep', s.pendingReports); set('#nv-ver', s.pendingVerify);
    if (PAGE === 'dash') renderDash(s);
  } catch(e) {}
}
setInterval(() => { if (A) loadBadges(); }, 20000);

/* ================= 路由 ================= */
document.querySelectorAll('#side .nav').forEach(el => el.onclick = () => go(el.dataset.p));
$('#refresh').onclick = () => { go(PAGE); loadBadges(); };
const TITLES = { dash:['概览','平台实时数据'], users:['用户管理','封禁、认证、重置密码'], posts:['内容管理','帖子与评论审核'], reports:['举报处理','用户提交的举报'], verify:['认证审批','官方认证 / 个人认证'], trends:['趋势干预','置顶或屏蔽话题'], admins:['管理员账号','增删管理人员'], editor:['界面编辑','可视化修改全站文案'], mods:['页面模块','模块显隐 / 排序 / 自定义'], ads:['广告管理','植入广告与横幅'] };
function go(p) {
  PAGE = p;
  document.querySelectorAll('#side .nav').forEach(el => el.classList.toggle('active', el.dataset.p === p));
  const t = TITLES[p] || ['概览',''];
  $('#pg-title').textContent = t[0]; $('#pg-sub').textContent = t[1];
  ({ dash:renderDashPage, users:renderUsers, posts:renderPosts, reports:renderReports, verify:renderVerify, trends:renderTrends, admins:renderAdmins, editor:renderEditor, mods:renderMods, ads:renderAds })[p]();
}

/* ================= 概览 ================= */
async function renderDashPage() {
  $('#view').innerHTML = '<div class="empty">加载中…</div>';
  try { STATS = await api('/api/admin/stats'); renderDash(STATS); } catch(e) { $('#view').innerHTML = `<div class="empty"><b>加载失败</b>${esc(e.message)}</div>`; }
}
function renderDash(s) {
  if (!s) return;
  const max = Math.max(1, ...s.trend.map(x => Math.max(x.users, x.posts)));
  const bars = s.trend.map(x => `<div class="bar" title="${x.lb} 注册 ${x.users} / 发帖 ${x.posts}">
      <div class="col"><div class="c1" style="height:${Math.round(x.users/max*100)}%"></div><div class="c2" style="height:${Math.round(x.posts/max*100)}%"></div></div>
      <div class="lb">${x.lb}</div></div>`).join('');
  $('#view').innerHTML = `
    <div class="grid">
      <div class="stat"><div class="k">注册用户</div><div class="v">${fmt(s.users)}</div><div class="d">今日新增 ${s.todayUsers}</div></div>
      <div class="stat"><div class="k">帖子总数</div><div class="v">${fmt(s.posts)}</div><div class="d">今日新增 ${s.todayPosts}</div></div>
      <div class="stat"><div class="k">评论总数</div><div class="v">${fmt(s.comments)}</div></div>
      <div class="stat"><div class="k">💌 私信消息</div><div class="v">${fmt(s.dms)}</div></div>
      <div class="stat"><div class="k">👨‍👩‍👧 群组</div><div class="v">${fmt(s.groups)}</div></div>
      <div class="stat warn"><div class="k">待办事项</div><div class="v">${s.pendingVerify + s.pendingReports}</div><div class="d">认证 ${s.pendingVerify} · 举报 ${s.pendingReports}</div></div>
      <div class="stat hot"><div class="k">🚫 已封禁</div><div class="v">${fmt(s.banned)}</div></div>
      <div class="stat hot"><div class="k">🗑 已下架帖子</div><div class="v">${fmt(s.removed)}</div></div>
    </div>
    <div class="card">
      <h3>近 7 天活跃</h3>
      <div class="bars">${bars}</div>
      <div class="legend"><span><i style="background:#1d9bf0"></i>新增用户</span><span><i style="background:#b9e2ff"></i>新增帖子</span></div>
    </div>
    <div class="card">
      <h3>热门帖子（按点赞）</h3>
      ${s.hot.length ? s.hot.map(p => `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--border)">

function openUser(id, un, role, banned) {
  const m = $('#modal'), b = $('#modal-body');
  b.innerHTML = `<h4>管理 @${esc(un)}</h4><p>选择要执行的操作</p>
    <div style="display:flex;flex-direction:column;gap:10px">

          <option value="verified" ${role==='verified'?'selected':''}>蓝V 认证</option>

  m.style.display = 'flex';
  $('#a-close').onclick = closeModal;
  $('#a-ban').onclick = async () => {
    try { await api('/api/admin/users/' + id, { method:'POST', body: JSON.stringify({ action:'ban', value: !banned }) }); toast(banned?'已解封':'已封禁'); closeModal(); renderUsers(); }
    catch(e) { toast(e.message, true); }
  };
  if ($('#a-del')) $('#a-del').onclick = async () => {
    if (!confirm(`确认永久删除 @${un} 及其全部内容？此操作不可恢复。`)) return;
    try { await api('/api/admin/users/' + id, { method:'POST', body: JSON.stringify({ action:'delete' }) }); toast('已删除'); closeModal(); renderUsers(); }
    catch(e) { toast(e.message, true); }
  };
  $('#a-save').onclick = async () => {
    const rv = $('#a-role').value, pwd = $('#a-pwd').value, nick = $('#a-nick').value.trim();
    try {
      if (rv !== role) await api('/api/admin/users/' + id, { method:'POST', body: JSON.stringify({ action:'role', value: rv }) });
      if (pwd) await api('/api/admin/users/' + id, { method:'POST', body: JSON.stringify({ action:'password', value: pwd }) });
      if (nick) await api('/api/admin/users/' + id, { method:'POST', body: JSON.stringify({ action:'nickname', value: nick }) });
      toast('已保存'); closeModal(); renderUsers(); loadBadges();
    } catch(e) { toast(e.message, true); }
  };
}

          <button class="btn line sm" data-id="${r.id}" data-a="ignore">忽略</button></td></tr>`).join('')}</tbody></table>`
      : '<div class="empty"><b>没有待处理举报</b>干净得很</div>';
    $('#r-list').querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      try {

          const ep = b.dataset.t === 'post' ? '/api/admin/posts/' : b.dataset.t === 'comment' ? '/api/admin/comments/' : '/api/admin/users/';
          const action = b.dataset.t === 'user' ? 'ban' : 'remove';
          await api(ep + b.dataset.tid, { method:'POST', body: JSON.stringify(b.dataset.t === 'user' ? { action:'ban', value:true } : { action }) });

        await api('/api/admin/reports/' + b.dataset.id, { method:'POST', body: JSON.stringify({ action: b.dataset.a === 'ignore' ? 'ignore' : 'handle' }) });
        toast('已处理'); renderReports(); loadBadges();

    });

  ['bookmark_empty_text','书签页空说明','书签为空时的说明文字'],
  ['footer_text','页脚文字','右侧栏底部文字（支持简单 HTML）'],
  ['trend_hint','趋势页说明','趋势列表底部的提示文案'],
  ['imgbb_key','图床 API Key','imgbb.com 的 API Key，配置后图片自动上传图床只存链接；留空则图片压缩后存数据库']
];
async function renderEditor() {
  $('#view').innerHTML = '<div class="empty">加载中…</div>';
  let rows = [];
  try { rows = await api('/api/admin/settings'); } catch(e) { $('#view').innerHTML = `<div class="empty">${e.message}</div>`; return; }
  const map = {}; rows.forEach(r => map[r.key] = r.value);
  $('#view').innerHTML = `
    <div class="card">
      <h3>可视化编辑器</h3>
      <p style="color:var(--muted);font-size:13px;margin:6px 0 16px">修改后保存，用户端刷新页面即可看到新内容。不会影响用户的帖子和互动数据。</p>
      ${EDITABLE.map(([k,label,hint]) => `
        <div style="margin-bottom:18px">
          <label style="font-weight:700;font-size:14px">${label} <span style="color:var(--muted);font-weight:400;font-size:12px">（key: ${k}）</span></label>
          <div style="color:var(--muted);font-size:12px;margin:2px 0 6px">${hint}</div>
          <textarea data-ek="${k}" style="width:100%;min-height:60px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;outline:none" placeholder="留空使用默认">${map[k] ?? ''}</textarea>
        </div>`).join('')}
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn sm" id="ed-save">保存全部</button>
        <span id="ed-msg" style="color:#00a341;font-size:13px"></span>
      </div>
    </div>
    <div class="card">
      <h3>新增自定义配置</h3>
      <p style="color:var(--muted);font-size:13px;margin:6px 0 12px"> key 仅限小写字母数字下划线（前端可用 document.title、公告等位置读取）。</p>
      <div style="display:flex;gap:10px">
        <input id="ed-nk" placeholder="key，如 term_text" style="border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;outline:none">
        <input id="ed-nv" placeholder="值" style="flex:1;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;outline:none">
        <button class="btn sm line" id="ed-add">添加</button>
      </div>
      ${rows.filter(r => !EDITABLE.some(e => e[0] === r.key)).map(r => `
        <div style="display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px;border:1px solid var(--border);border-radius:10px">
          <b style="font-size:13px">${r.key}</b>
          <span style="flex:1;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(r.value||'').slice(0,60)}</span>
          <button class="btn sm line" data-delk="${r.key}">删除</button>
        </div>`).join('')}
    </div>`;
  $('#ed-save').onclick = async () => {
    const body = {};
    document.querySelectorAll('[data-ek]').forEach(t => body[t.dataset.ek] = t.value);
    try { await api('/api/admin/settings', { method:'PUT', body: JSON.stringify(body) }); $('#ed-msg').textContent = '已保存，用户端刷新生效'; toast('界面配置已保存'); }
    catch(e) { toast(e.message, true); }
  };
  $('#ed-add').onclick = async () => {
    const k = $('#ed-nk').value.trim(), v = $('#ed-nv').value;
    if (!/^[a-z0-9_]{1,40}$/.test(k)) return toast('key 格式不对', true);
    try { await api('/api/admin/settings', { method:'PUT', body: JSON.stringify({[k]: v}) }); toast('已添加'); renderEditor(); }
    catch(e) { toast(e.message, true); }
  };
  document.querySelectorAll('[data-delk]').forEach(b => b.onclick = async () => {
    try { await api('/api/admin/settings/' + b.dataset.delk, { method:'DELETE' }); toast('已删除'); renderEditor(); }
    catch(e) { toast(e.message, true); }
  });
}

/* ================= 页面模块编辑 ================= */
const PAGE_MODULES={
  home:[['home:notice','首页公告条'],['home:tabs','给你/关注切换栏'],['home:composer','发帖框'],['home:feed','帖子列表（内容不动）']],
  groups:[['groups:newbtn','发起群聊按钮'],['groups:list','群组列表']],
  notif:[['notif:tabs','全部/提及切换栏']],
  bm:[['bm:list','书签列表（内容不动）']],
};
const PAGE_NAMES={home:'首页',groups:'群组',notif:'通知',bm:'书签'};
async function renderMods(){
  $('#view').innerHTML='<div class="empty">加载中…</div>';
  let cfg={};
  try{(await api('/api/admin/settings')).forEach(r=>cfg[r.key]=r.value)}catch(e){$('#view').innerHTML=`<div class="empty">${e.message}</div>`;return}
  let M={order:{},hide:{},text:{},custom:[]};
  try{M=Object.assign(M,JSON.parse(cfg.modules_json||'null')||{})}catch(e){}
  window._M=M;window._MPage=window._MPage||'home';
  const copies=Object.entries(M.pages||{});
  const copyHtml=copies.length?copies.map(([id,pg])=>`
      <div class="card" style="display:flex;align-items:center;gap:10px">
        <div style="flex:1"><b>${pg.name||id}</b><div style="font-size:12px;color:#657786">复制页 / id:${id}</div></div>
        <a class="btn line sm" href="/" target="_blank" onclick="sessionStorage.setItem('em_go','1')">打开浏览</a>
        <button class="btn danger sm" id="cp-del-${id}">删除</button>
      </div>`).join(''):'<div class="empty">还没有复制页。打开网站编辑模式，进入某个页面点"复制本页"即可创建广告落地页。</div>';
  $('#view').innerHTML=`
    <div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:10px">
      <div style="flex:1"><b>Wix 式可视化编辑器</b><div style="font-size:12px;color:#657786">直接在页面上点击区块进行删改、上下移动、添加图片广告（带按钮）；按钮/表单等交互逻辑自动锁定。</div></div>
      <a class="btn pri" href="/?edit=1" target="_blank">打开编辑模式</a>
    </div>
    <div class="card" style="margin-bottom:14px">
      <b>复制页（广告落地页）</b>
      <div style="margin-top:8px">${copyHtml}</div>
    </div>
    <div id="mods-legacy"></div>`;
  copies.forEach(([id])=>{const b=document.getElementById('cp-del-'+id);if(b)b.onclick=async()=>{if(!confirm('确认删除该复制页？'))return;delete M.pages[id];try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({modules_json:JSON.stringify(M)})});toast('已删除');renderMods()}catch(e){toast(e.message,true)}}});
  const legacy=document.getElementById('mods-legacy');
  const draw=()=>{
    const _view=document.getElementById('view');
    const pg=window._MPage;
    const mods=PAGE_MODULES[pg]||[];
    const order=M.order[pg]||[];
    const sorted=[...mods].sort((a,b)=>{
      const ia=order.indexOf(a[0]),ib=order.indexOf(b[0]);
      return (ia<0?999:ia)-(ib<0?999:ib);
    });
    document.getElementById('mods-legacy').innerHTML=`
      <div class="card">
        <h3>页面模块编辑（所见即所得）</h3>
        <p style="color:var(--muted);font-size:13px;margin:6px 0 12px">选择页面 → 对模块进行 隐藏/显示、上下移动排序、覆盖文字；也可向页面插入自定义 HTML 模块（如活动横幅）。用户的帖子和数据不会被动。</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
          ${Object.keys(PAGE_MODULES).map(k=>`<button class="btn sm ${k===pg?'':'line'}" data-mp="${k}">${PAGE_NAMES[k]}</button>`).join('')}
        </div>
        <div id="mod-list">
        ${sorted.map(([k,label])=>`
          <div style="border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px">
            <div style="display:flex;align-items:center;gap:10px">
              <b style="font-size:14px;flex:1">${label}</b>
              <button class="btn sm line" data-mu="${k}" title="上移">↑</button>
              <button class="btn sm line" data-md="${k}" title="下移">↓</button>
              <button class="btn sm ${M.hide[k]?'':'g'}" data-mh="${k}">${M.hide[k]?'已隐藏 · 恢复':'显示中 · 隐藏'}</button>
            </div>
            <textarea data-mt="${k}" placeholder="覆盖此模块的 HTML 内容（留空 = 保持原样）" style="width:100%;min-height:44px;margin-top:8px;border:1px solid var(--border);border-radius:10px;padding:8px;font-size:13px;font-family:inherit;outline:none">${(M.text&&M.text[k])||''}</textarea>
          </div>`).join('')||'<div class="empty">此页面暂无模块</div>'}
        </div>
        <div style="display:flex;gap:10px;margin-top:12px;align-items:center">
          <button class="btn sm" id="mods-save">保存全部修改</button>
          <button class="btn sm line" id="mods-reset">恢复默认</button>
          <span id="mods-msg" style="color:#00a341;font-size:13px"></span>
        </div>
      </div>
      <div class="card">
        <h3>插入自定义模块</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
          <select id="cm-page" style="border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;outline:none">
            ${Object.keys(PAGE_MODULES).map(k=>`<option value="${k}">${PAGE_NAMES[k]}</option>`).join('')}
          </select>
          <input id="cm-title" placeholder="模块名称（仅后台标识）" style="border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;outline:none">
        </div>
        <textarea id="cm-html" placeholder="模块 HTML 内容，可用 <img src=...> 插入宣传图、<a href=...> 链接等" style="width:100%;min-height:90px;margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:13px;font-family:inherit;outline:none"></textarea>
        <button class="btn sm" id="cm-add" style="margin-top:10px">添加到页面</button>
        ${(M.custom||[]).length?`<div style="margin-top:14px">${M.custom.map(x=>`
          <div style="display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">
            <b style="font-size:13px">${x.id}</b><span style="color:var(--muted);font-size:12px">${PAGE_NAMES[x.page]||x.page}</span>
            <span style="flex:1;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(x.html||'').replace(/<[^>]+>/g,' ').slice(0,40)}</span>
            <button class="btn sm line" data-cmdel="${x.id}" style="color:var(--danger);border-color:var(--danger)">删除</button>
          </div>`).join('')}</div>`:''}
      </div>`;
    document.querySelectorAll('[data-mp]').forEach(b=>b.onclick=()=>{window._MPage=b.dataset.mp;draw()});
    const persist=async(msg)=>{try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({modules_json:JSON.stringify(M)})});$('#mods-msg').textContent=msg||'已保存，用户端刷新生效'}catch(e){toast(e.message,true)}};
    document.querySelectorAll('[data-mh]').forEach(b=>b.onclick=()=>{const k=b.dataset.mh;M.hide[k]=!M.hide[k];persist();draw()});
    document.querySelectorAll('[data-mu]').forEach(b=>b.onclick=()=>{const k=b.dataset.mu;const arr=M.order[pg]=M.order[pg]||mods.map(m=>m[0]);const i=arr.indexOf(k);if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];persist();draw()}});
    document.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{const k=b.dataset.md;const arr=M.order[pg]=M.order[pg]||mods.map(m=>m[0]);const i=arr.indexOf(k);if(i>-1&&i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];persist();draw()}});
    document.querySelectorAll('[data-mt]').forEach(t=>t.onchange=()=>{M.text[t.dataset.mt]=t.value;persist('文字已保存')});
    $('#mods-save').onclick=()=>persist();
    $('#mods-reset').onclick=()=>{M={order:{},hide:{},text:{},custom:M.custom};persist('已恢复默认');draw()};
    $('#cm-add').onclick=()=>{
      const id='c'+Date.now().toString(36),pg2=$('#cm-page').value,html=$('#cm-html').value.trim();
      if(!html)return toast('请填写模块内容',true);
      M.custom=M.custom||[];M.custom.push({id,page:pg2,html});M.hide['custom:'+id]=false;
      persist('自定义模块已添加').then(()=>{renderMods()});
    };
    document.querySelectorAll('[data-cmdel]').forEach(b=>b.onclick=()=>{
      M.custom=(M.custom||[]).filter(x=>x.id!==b.dataset.cmdel);delete M.hide['custom:'+b.dataset.cmdel];
      persist('已删除').then(()=>{renderMods()});
    });
  };
  draw();
}

/* ================= 广告管理 ================= */
async function renderAds() {
  $('#view').innerHTML = '<div class="empty">加载中…</div>';
  let rows = [];
  try { rows = await api('/api/admin/ads'); } catch(e) { $('#view').innerHTML = `<div class="empty">${e.message}</div>`; return; }
  $('#view').innerHTML = `
    <div class="card">
      <h3>新建广告</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
        <input id="ad-title" placeholder="标题 *" style="border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;outline:none">
        <input id="ad-cta" placeholder="按钮文字，默认 了解详情" style="border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;outline:none">
        <input id="ad-body" placeholder="描述文字" style="grid-column:1/-1;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;outline:none">
        <input id="ad-link" placeholder="跳转链接 https://..." style="border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;outline:none">
        <div style="display:flex;gap:8px">
          <input id="ad-img" placeholder="图片（上传本地图片或填 URL）" style="flex:1;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;outline:none">
          <button class="btn sm line" id="ad-img-up" type="button">上传本地图片</button>
          <input type="file" id="ad-img-file" accept="image/*" style="display:none">
        </div>
        <div id="ad-img-preview" style="grid-column:1/-1;display:none"><img style="max-width:100%;max-height:160px;border-radius:10px" alt="预览"></div>
      </div>
      <button class="btn sm" id="ad-create" style="margin-top:12px">发布广告</button>
    </div>
    <div class="card">
      <h3>已有广告（${rows.length}）</h3>
      ${rows.length ? rows.map(a => `
        <div style="border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px">
          <div style="display:flex;align-items:center;gap:8px">
            <b style="font-size:15px">${a.title}</b>
            <span class="tag ${a.active ? 'g' : ''}">${a.active ? '投放中' : '已暂停'}</span>
            <span style="margin-left:auto;color:var(--muted);font-size:12px">展示 ${a.views} · 点击 ${a.clicks}</span>
          </div>
          <div style="color:var(--muted);font-size:13px;margin-top:4px">${a.body || ''}</div>
          ${a.link ? `<div style="color:var(--blue);font-size:12px;margin-top:2px">${a.link}</div>` : ''}
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn sm line" data-tg="${a.id}" data-on="${a.active}">${a.active ? '暂停' : '恢复投放'}</button>
            <button class="btn sm line" style="color:var(--danger);border-color:var(--danger)" data-del="${a.id}">删除</button>
          </div>
        </div>`).join('') : '<div class="empty">还没有广告，先创建一条</div>'}
    </div>`;
  $('#ad-img-up').onclick = () => $('#ad-img-file').click();
  $('#ad-img-file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    e.target.value = '';
    try {
      const data = await new Promise((res, rej) => {
        const img = new Image(); const fr = new FileReader();
        fr.onload = () => { img.onload = () => {
          const MAX = 1600, k = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          let out, q = 0.85;
          do { out = c.toDataURL('image/jpeg', q); q -= 0.08 } while (out.length > 1400000 && q > 0.35);
          res(out);
        }; img.onerror = () => rej(new Error('图片读取失败')); img.src = fr.result; };
        fr.onerror = () => rej(new Error('图片读取失败'));
        fr.readAsDataURL(f);
      });
      let final = data;
      try { const up = await api('/api/upload', { method: 'POST', body: JSON.stringify({ data }) }); if (up && up.url) final = up.url; } catch (e) {}
      $('#ad-img').value = final;
      const pv = $('#ad-img-preview'); pv.style.display = ''; pv.querySelector('img').src = final;
      toast(up_url(final));
    } catch (err) { toast(err.message, true); }
  };
  $('#ad-create').onclick = async () => {
    const title = $('#ad-title').value.trim();
    if (!title) return toast('标题不能为空', true);
    try {
      await api('/api/admin/ads', { method:'POST', body: JSON.stringify({
        title, body: $('#ad-body').value, link: $('#ad-link').value, cta: $('#ad-cta').value, image: $('#ad-img').value, active: true }) });
      toast('广告已发布'); renderAds();
    } catch(e) { toast(e.message, true); }
  };
  document.querySelectorAll('[data-tg]').forEach(b => b.onclick = async () => {
    try { await api('/api/admin/ads/' + b.dataset.tg, { method:'PUT', body: JSON.stringify({ active: b.dataset.on !== 'true' }) }); toast('已更新'); renderAds(); }
    catch(e) { toast(e.message, true); }
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('确定删除该广告？')) return;
    try { await api('/api/admin/ads/' + b.dataset.del, { method:'DELETE' }); toast('已删除'); renderAds(); }
    catch(e) { toast(e.message, true); }
  });
}

$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
