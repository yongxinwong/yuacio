services:
  - type: web
    name: yuacio
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/posts
    envVars:
      - key: DATABASE_URL
        sync: false   # 部署时填入 Neon 连接串
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
